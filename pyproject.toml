[project]
name = "easytrain"
version = "0.1.0"
description = "pipeline() for training: pick a task, pretrained model, dataset, and train."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Carter Stach" }]
keywords = [
  "transformers",
  "training",
  "fine-tuning",
  "nlp",
  "huggingface",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Education",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "torch>=2.2",
  "transformers>=4.44",
  "datasets>=2.21",
  "accelerate>=0.34",
  "peft>=0.12",
  "evaluate>=0.4.3",
  "seqeval>=1.2.2",
  "scikit-learn>=1.4",
  "pandas>=2.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/SpyC0der77/easytrainer"
Repository = "https://github.com/SpyC0der77/easytrainer"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
easytrain = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
